name: CI

on: [push, pull_request]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # requirements.txt is the lean dashboard runtime; the full toolchain
      # (ingestion, dbt, Great Expectations, analysis, ruff, pytest) is in
      # requirements-dev.txt.
      - run: pip install -r requirements-dev.txt
      - run: ruff check ingestion/ dashboard/ scripts/ tests/ data_quality/ airflow/ analysis/
      - run: pytest tests/ -v

  dbt-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install dbt-bigquery
      # Parse-only in CI: `dbt parse` validates that the project compiles (refs,
      # sources, macros, Jinja) into a manifest WITHOUT connecting to BigQuery,
      # so no credentials are needed. Dummy env vars satisfy profiles.yml.
      - run: cd dbt_transit && dbt parse --profiles-dir .
        env:
          GCP_PROJECT_ID: ci-dummy-project
          BQ_DATASET_RAW: raw
          BQ_DATASET_STAGING: staging
          BQ_DATASET_MARTS: marts
          BQ_LOCATION: US
